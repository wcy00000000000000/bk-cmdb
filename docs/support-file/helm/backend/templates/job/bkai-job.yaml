{{- if .Values.bkai.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "bk-cmdb.fullname" . }}-bkai-{{ .Release.Revision }}
  labels:
    app: {{ template "bk-cmdb.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
spec:
  ttlSecondsAfterFinished: 600
  completions: 1
  parallelism: 1
  template:
    spec:
      {{- include "cmdb.imagePullSecrets" . | nindent 6 }}
      containers:
      - args:
        - sync
        - -f
        - {{ .Values.bkai.packagePath | quote }}
        - --tenant-id
        - {{ .Values.bkai.tenantId | quote }}
        - --space
        - {{ .Values.bkai.space | quote }}
        - --confirm
        {{- if .Values.bkai.publish }}
        - --publish
        - --publish_config_only=0
        {{- end }}
        - --var
        - BK_CMDB_MCP_CODE={{ .Values.bkApigatewayName }}-{{ .Values.apigatewaySync.stageName }}-mcp
        - --var
        - BK_CMDB_INTERNAL_MCP_CODE={{ .Values.bkApigatewayName }}-{{ .Values.apigatewaySync.stageName }}-internal
        {{- range .Values.bkai.excludeResources }}
        - --exclude-resource
        - {{ . | quote }}
        {{- end }}
        image: {{ .Values.image.registry }}/{{ .Values.bkai.image.repository }}:v{{ default .Chart.AppVersion .Values.bkai.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: cmdb-sync-bkai
        env:
        - name: BK_API_URL_TMPL
          value: {{ .Values.common.apiGW.address | quote }}
        - name: BKAI_APP_CODE
          value: {{ .Values.common.apiGW.appCode | quote }}
        - name: BKAI_APP_SECRET
          value: {{ .Values.common.apiGW.appSecret | quote }}
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            memory: 256Mi
            cpu: 100m
      restartPolicy: OnFailure
  backoffLimit: 3
{{- end }}
