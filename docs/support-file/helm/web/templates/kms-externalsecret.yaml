{{- if and .Values.kms.enabled .Values.kms.createResources }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.kms.secretName }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: kms
spec:
  provider:
    vault:
      server: {{ .Values.kms.server | quote }}
      path: {{ .Values.kms.path | quote }}
      version: v2
      {{- if .Values.kms.tls.caSecretName }}
      caProvider:
        type: Secret
        name: {{ .Values.kms.tls.caSecretName | quote }}
        key: {{ .Values.kms.tls.caSecretKey | quote }}
        namespace: {{ .Release.Namespace | quote }}
      {{- end }}
      {{- if .Values.kms.tls.clientSecretName }}
      clientTls:
        certSecretRef:
          name: {{ .Values.kms.tls.clientSecretName | quote }}
          key: {{ .Values.kms.tls.clientCertKey | quote }}
          namespace: {{ .Release.Namespace | quote }}
        keySecretRef:
          name: {{ .Values.kms.tls.clientSecretName | quote }}
          key: {{ .Values.kms.tls.clientKeyKey | quote }}
          namespace: {{ .Release.Namespace | quote }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ .Values.kms.authMountPath | quote }}
          role: {{ include "cmdb.kms.role" . | quote }}
          serviceAccountRef:
            name: {{ include "cmdb.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kms.secretName }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: kms
spec:
  refreshInterval: {{ .Values.kms.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.kms.secretName }}
    kind: SecretStore
  target:
    name: {{ .Values.kms.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.kms.privateKeyKey }}
      remoteRef:
        key: {{ include "cmdb.kms.credentialPath" . | quote }}
        property: private_key
    - secretKey: {{ .Values.kms.envelopeKey }}
      remoteRef:
        key: {{ include "cmdb.kms.credentialPath" . | quote }}
        property: envelope
{{- end }}
